<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>I.M.A FILMES V10.1</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
    <div class="brand"><span>🎬</span><strong>I.M.A FILMES</strong></div>
    <div class="top-actions">
      <div class="search-wrap"><span>🔎</span><input id="search" placeholder="Pesquisar filmes, séries, anime, doramas..." /></div>
      <button class="icon-btn" id="settingsBtn" title="Configurações">⚙️</button>
      <button class="profile-btn" id="profileBtn" title="Perfil">👤</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main id="main" class="main"></main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" data-close-modal>×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
