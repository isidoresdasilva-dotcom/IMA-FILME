<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.M.A Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topo">
    <div class="logo">🎬 I.M.A <span>FILMES</span></div>

    <div class="pesquisa">
        🔎
        <input type="text" placeholder="Pesquisar filmes e séries...">
    </div>

    <div class="acoes">
        <button>🔔</button>
        <button>⚙️</button>
        <button class="perfil">👤</button>
    </div>
</header>

<div class="estrutura">

    <aside class="menu">

        <button class="menu-ativo">🏠 Início</button>
        <button>🎬 Filmes</button>
        <button>📺 Séries</button>
        <button>⭐ Favoritos</button>

        <hr>

        <button class="enviar">📤 Enviar Filme</button>
        <button>🗂️ Minha Biblioteca</button>

        <div class="espaco"></div>

        <button>⚙️ Configurações</button>
        <button>🔐 Administrador</button>

    </aside>

    <main class="conteudo">

        <section class="banner">

            <div>
                <p class="pequeno">BEM-VINDO AO</p>

                <h1>I.M.A FILMES</h1>

                <p>
                    A sua biblioteca digital para guardar,
                    organizar e compartilhar seus vídeos.
                </p>

                <button class="botao-principal">
                    📤 Enviar primeiro filme
                </button>
            </div>

        </section>

        <div class="titulo-secao">
            <h2>🎬 Minha Biblioteca</h2>
            <button>Ver todos →</button>
        </div>

        <section class="filmes">

            <article class="card">
                <div class="capa capa1">🎬</div>
                <h3>Meu Filme</h3>
                <p>Filme • 2026</p>
                <div class="botoes">
                    <button>▶️</button>
                    <button>⬇️</button>
                    <button>🔗</button>
                </div>
            </article>

            <article class="card">
                <div class="capa capa2">📺</div>
                <h3>Minha Série</h3>
                <p>Série • Temporada 1</p>
                <div class="botoes">
                    <button>▶️</button>
                    <button>⬇️</button>
                    <button>🔗</button>
                </div>
            </article>

            <article class="card">
                <div class="capa capa3">🎞️</div>
                <h3>Vídeo 3</h3>
                <p>Filme • 2026</p>
                <div class="botoes">
                    <button>▶️</button>
                    <button>⬇️</button>
                    <button>🔗</button>
                </div>
            </article>

            <article class="card">
                <div class="capa capa4">🍿</div>
                <h3>Vídeo 4</h3>
                <p>Série • Temporada 2</p>
                <div class="botoes">
                    <button>▶️</button>
                    <button>⬇️</button>
                    <button>🔗</button>
                </div>
            </article>

        </section>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
